Event:
  type: object
  properties:
    id:
      type: string
    title:
      type: string
    description:
      type: string
    startDate:
      type: string
      format: date-time
    endDate:
      type: string
      format: date-time
    location:
      type: string
    region:
      type: string
    imageUrl:
      type: string
    organizerId:
      type: string
    sports:
      type: array
      items:
        type: string
