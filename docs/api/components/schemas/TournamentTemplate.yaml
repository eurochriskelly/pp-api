type: object
required:
  - id
  - title
  - fixtureCount
  - pitchCount
  - competitionCount
  - competitions
properties:
  id:
    type: integer
  title:
    type: string
  date:
    type: string
    format: date
  location:
    type: string
  fixtureCount:
    type: integer
  pitchCount:
    type: integer
  competitionCount:
    type: integer
  competitions:
    type: array
    items:
      $ref: '#/components/schemas/TournamentTemplateCompetition'
